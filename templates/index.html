<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイル作成テスト</title>
</head>
<body>
    <h1>ホストPCのダウンロードフォルダにファイルを作成</h1>
    
    <button id="createBtn">空のtxtファイルを作成</button>
    <p id="resultMessage"></p>

    <script>
        document.getElementById('createBtn').addEventListener('click', async () => {
            const resultElement = document.getElementById('resultMessage');
            resultElement.textContent = "処理中...";

            try {
                const response = await fetch('/create-file', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultElement.textContent = `成功: ${data.message}`;
                    resultElement.style.color = "green";
                } else {
                    resultElement.textContent = `エラー: ${data.message}`;
                    resultElement.style.color = "red";
                }
            } catch (error) {
                resultElement.textContent = `通信エラーが発生しました: ${error}`;
                resultElement.style.color = "red";
            }
        });
    </script>
</body>
</html>
