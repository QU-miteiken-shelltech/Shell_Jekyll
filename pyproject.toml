[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shell_jekyll"]

[tool.hatch.build]
exclude = [
  "/venv",
  "/.git",
  "/.pytest_cache",
  "/**/__pycache__",
]

[project]
name = "ShellJekyll"
version = "2026.0.1"
dependencies = [
  "PySide6",
  "PyOpenGL",
  "opencv-python",
  "numpy",
  "cel-expr-python",
  "psutil",
  "python-mpv"
]
requires-python = ">=3.12"
authors = [
  {name = "shinonome-MiDUki", email = "shiinaayame3@gmail.com"}
]
maintainers = [
  {name = "shinonome-MiDUki", email = "shiinaayame3@gmail.com"}
]
description = "Shell Jekyll 2026"
readme = "README.md"
license = "Apache-2.0"
keywords = ["python", "shelljekyll"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]

[project.scripts]
jkl = "shell_jekyll.__main__:main"

[project.urls]
Repository = "https://github.com/shinonome-MiDUki/Shell_DELTA"